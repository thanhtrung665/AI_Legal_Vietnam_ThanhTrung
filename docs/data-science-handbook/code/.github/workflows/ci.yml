# Copy to the repository root .github/workflows/ to activate.
name: churn-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/data-science-handbook/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m churn.models.train --config configs/train.yaml
      - uses: actions/upload-artifact@v4
        with: { name: model, path: docs/data-science-handbook/code/models/ }
