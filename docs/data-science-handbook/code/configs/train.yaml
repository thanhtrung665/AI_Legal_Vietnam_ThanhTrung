target: churn
random_state: 42
data_path: data/raw/churn.parquet   # falls back to synthetic data when the file is absent
split:
  date_col: signup_date
  train_end: "2023-10-01"
  valid_end: "2024-01-01"
  gap_days: 0
model_params:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
quality_gate:
  valid_roc_auc: 0.70
  valid_pr_auc: 0.35
